<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfaf8">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script src="/js/theme-init.js"></script>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <button class="theme-btn theme-float" id="theme-btn" type="button" aria-label="Switch to dark theme" title="Switch theme">
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
  </button>
<a class="skip" href="#main">Skip to content</a>
<div class="auth-wrap">
  <div class="auth-form-side">
    <main class="auth-form" id="main">
      <a class="brand" href="/" style="margin-bottom:32px"><img src="/assets/logo.svg" width="28" height="28" alt=""> bugatti.lol</a>
      <div class="auth-head">
        <h1>Choose a new password</h1>
        <p>Setting a new password signs you out everywhere else.</p>
      </div>
      <div class="alert" id="alert" role="alert" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        <span id="alert-text"></span>
      </div>
      <form id="form" novalidate>
        <div class="field">
          <label for="pw">New password</label>
          <div class="input-wrap has-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="pw" type="password" autocomplete="new-password" required placeholder="At least 10 characters">
            <button class="reveal" id="reveal" type="button" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="pw-meter" id="pw-meter" data-score="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <p class="hint">Strength: <span id="pw-label">â€”</span>. Mix letters with a number and a symbol.</p>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <div class="input-wrap has-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
            <input id="confirm" type="password" autocomplete="new-password" required placeholder="Repeat your password">
          </div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="submit" type="submit">Update password</button>
      </form>
    </main>
  </div>
  <aside class="auth-aside">
    <div>
      <div class="aside-mark" aria-hidden="true"><span class="on"></span><span class="on"></span><span></span></div>
      <blockquote class="aside-quote"><p>Reset links are single-use and expire after 60 minutes.</p></blockquote>
    </div>
    <div class="aside-stats">
      <div><b>70+</b><span>Sources</span></div>
      <div><b>190</b><span>Countries</span></div>
      <div><b>&lt;4s</b><span>Median</span></div>
    </div>
  </aside>
</div>
<script src="/js/site.js"></script>
<script src="/js/reset.js"></script>
</body>
</html>
