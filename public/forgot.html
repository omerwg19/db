<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — Veriscope</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfaf8">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="auth-wrap">
  <div class="auth-form-side">
    <main class="auth-form" id="main">
      <a class="brand" href="/" style="margin-bottom:32px"><img src="/assets/logo.svg" width="28" height="28" alt=""> Veriscope</a>
      <div class="auth-head">
        <h1>Reset your password</h1>
        <p>Enter the email on your account and we will send a reset link.</p>
      </div>
      <div class="alert" id="alert" role="alert" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        <span id="alert-text"></span>
      </div>
      <form id="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap has-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
            <input id="email" type="email" autocomplete="email" required placeholder="you@company.com" autofocus>
          </div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="submit" type="submit">Send reset link</button>
      </form>
      <p class="auth-switch"><a href="/login.html">Back to sign in</a></p>
    </main>
  </div>
  <aside class="auth-aside">
    <div>
      <div class="aside-mark" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
      <blockquote class="aside-quote"><p>We keep no query log, so resetting a password leaves nothing behind to purge on our side.</p></blockquote>
    </div>
    <div class="aside-stats">
      <div><b>70+</b><span>Sources</span></div>
      <div><b>190</b><span>Countries</span></div>
      <div><b>&lt;4s</b><span>Median</span></div>
    </div>
  </aside>
</div>
<script src="/js/site.js"></script>
<script>
(function(){
  var f=document.getElementById('form'),a=document.getElementById('alert'),t=document.getElementById('alert-text'),
      s=document.getElementById('submit'),e=document.getElementById('email');
  function say(m,k){t.textContent=m;a.className='alert on alert-'+(k||'error');}
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(e.value.trim())){say('Enter a valid email address.');return;}
    s.disabled=true;s.textContent='Sending…';
    fetch('/api/password/forgot',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.value.trim()})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,data:d};});})
      .then(function(res){
        s.disabled=false;s.textContent='Send reset link';
        if(!res.ok){say(res.data.error||'Could not send the link.');return;}
        var msg='If that address has an account, a reset link is on its way. The link is valid for 60 minutes.';
        if(res.data.devLink){msg+=' Development mode: '+res.data.devLink;}
        say(msg,'ok');
      })
      .catch(function(){s.disabled=false;s.textContent='Send reset link';say('Network error. Try again.');});
  });
})();
</script>
</body>
</html>
